spring.application.name=practikalia
spring.jpa.hibernate.ddl-auto=validate

# db/migration es el esquema, comun a todos los motores. db/vendor/<motor>
# queda para lo que solo aplica a uno: hoy los datos de demostracion, que son
# de Postgres. Los tests corren sobre H2, que ni entiende su sintaxis ni debe
# ver esas filas, porque falsearian los conteos.
# Va fuera de db/migration a proposito: Flyway escanea cada ubicacion de forma
# recursiva, asi que una subcarpeta de db/migration se cargaria igualmente.
# Una ubicacion inexistente (db/vendor/h2) se ignora sin fallar.
spring.flyway.locations=classpath:db/migration,classpath:db/vendor/{vendor}

app.uploads-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.review.calificacion-min=${REVIEW_CALIFICACION_MIN:1}
app.review.calificacion-max=${REVIEW_CALIFICACION_MAX:5}
