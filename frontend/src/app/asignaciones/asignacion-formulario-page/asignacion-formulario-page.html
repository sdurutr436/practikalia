<main class="o-pagina">
  <app-volver [a]="['/empresas', empresaId]" texto="Volver a la empresa" />

  @if (cargando()) {
    <p>Cargando…</p>
  } @else {
    <form class="c-formulario" [formGroup]="form" (ngSubmit)="enviar()">
      <h1 class="c-formulario__titulo">Nueva asignación</h1>

      @if (error(); as mensaje) {
        <app-alerta>{{ mensaje }}</app-alerta>
      }

      <app-campo
        etiqueta="Alumno"
        icono="persona"
        para="alumno"
        [control]="form.controls.alumnoId"
        error="Selecciona un alumno."
      >
        <select class="c-campo__entrada" id="alumno" formControlName="alumnoId">
          <option [value]="0" disabled>Selecciona un alumno</option>
          @for (alumno of alumnos(); track alumno.id) {
            <option [value]="alumno.id">{{ alumno.correo }}</option>
          }
        </select>
      </app-campo>

      <app-campo
        etiqueta="Tutor de centro"
        icono="persona"
        para="tutor"
        [control]="form.controls.tutorCentroId"
        error="Selecciona un tutor."
      >
        <select class="c-campo__entrada" id="tutor" formControlName="tutorCentroId">
          <option [value]="0" disabled>Selecciona un tutor</option>
          @for (tutor of tutores(); track tutor.id) {
            <option [value]="tutor.id">{{ tutor.correo }}</option>
          }
        </select>
      </app-campo>

      <app-campo
        etiqueta="Grado"
        icono="grado"
        para="grado"
        [control]="form.controls.gradoId"
        error="Selecciona un grado."
      >
        <select class="c-campo__entrada" id="grado" formControlName="gradoId">
          <option [value]="0" disabled>Selecciona un grado</option>
          @for (grado of grados(); track grado.id) {
            <option [value]="grado.id">{{ grado.nombre }}</option>
          }
        </select>
      </app-campo>

      <app-campo
        etiqueta="Año"
        icono="numero"
        para="anio"
        [control]="form.controls.anio"
        error="Indica un año válido."
      >
        <input class="c-campo__entrada" id="anio" type="number" formControlName="anio" />
      </app-campo>

      <app-campo
        etiqueta="Fecha de inicio"
        icono="fecha"
        para="fecha-inicio"
        [control]="form.controls.fechaInicio"
        error="Indica la fecha de inicio."
      >
        <input
          class="c-campo__entrada"
          id="fecha-inicio"
          type="date"
          formControlName="fechaInicio"
        />
      </app-campo>

      <app-boton tipo="submit" icono="anadir" [cargando]="guardando()">Crear asignación</app-boton>
    </form>
  }
</main>
