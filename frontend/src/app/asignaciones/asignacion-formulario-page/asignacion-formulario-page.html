<main class="o-pagina">
  <app-volver [a]="['/empresas', empresaId]" texto="Volver a la empresa" />

  @if (cargando()) {
    <p>Cargando…</p>
  } @else {
    <form class="c-formulario" [formGroup]="form" (ngSubmit)="enviar()">
      <h1 class="c-formulario__titulo">Nueva asignación</h1>

      @if (error(); as mensaje) {
        <app-alerta>{{ mensaje }}</app-alerta>
      }

      <app-campo
        etiqueta="Alumno"
        icono="persona"
        para="alumno"
        [control]="form.controls.alumnoId"
        error="Selecciona un alumno."
      >
        <app-desplegable
          id="alumno"
          [control]="form.controls.alumnoId"
          [opciones]="opcionesAlumno()"
        />
      </app-campo>

      <app-campo
        etiqueta="Tutor de centro"
        icono="persona"
        para="tutor"
        [control]="form.controls.tutorCentroId"
        error="Selecciona un tutor."
      >
        <app-desplegable
          id="tutor"
          [control]="form.controls.tutorCentroId"
          [opciones]="opcionesTutor()"
        />
      </app-campo>

      <app-campo
        etiqueta="Grado"
        icono="grado"
        para="grado"
        [control]="form.controls.gradoId"
        error="Selecciona un grado."
      >
        <app-desplegable
          id="grado"
          [control]="form.controls.gradoId"
          [opciones]="opcionesGrado()"
        />
      </app-campo>

      <app-campo
        etiqueta="Año"
        icono="numero"
        para="anio"
        [control]="form.controls.anio"
        error="Indica un año válido."
      >
        <input class="c-campo__entrada" id="anio" type="number" formControlName="anio" />
      </app-campo>

      <app-campo
        etiqueta="Fecha de inicio"
        icono="fecha"
        para="fecha-inicio"
        [control]="form.controls.fechaInicio"
        error="Indica la fecha de inicio."
      >
        <input
          class="c-campo__entrada"
          id="fecha-inicio"
          type="date"
          formControlName="fechaInicio"
        />
      </app-campo>

      <app-boton tipo="submit" icono="anadir" [cargando]="guardando()">Crear asignación</app-boton>
    </form>
  }
</main>
