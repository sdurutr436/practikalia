<main class="o-pagina">
  <header class="c-cabecera">
    <h1 class="c-cabecera__titulo">Empresas</h1>
    <nav class="c-acciones" aria-label="Acciones de la sesión">
      @if (sesion()?.rol === 'PROFESOR') {
        <a class="c-boton" routerLink="/empresas/nueva"><app-icono nombre="anadir" />Nueva empresa</a>
        <a class="c-boton c-boton--secundario" routerLink="/reviews/pendientes">
          <app-icono nombre="moderacion" />Reviews pendientes
        </a>
      }
      @if (sesion()?.rol === 'ALUMNO') {
        <a class="c-boton c-boton--secundario" routerLink="/mis-intereses">
          <app-icono nombre="interes" />Mis intereses
        </a>
        <a class="c-boton c-boton--secundario" routerLink="/mis-etiquetas">
          <app-icono nombre="etiqueta" />Mis etiquetas
        </a>
        <a class="c-boton c-boton--secundario" routerLink="/mi-afinidad">
          <app-icono nombre="afinidad" />Mi afinidad
        </a>
      }
      <button class="c-boton c-boton--secundario" type="button" (click)="cerrarSesion()">
        <app-icono nombre="salir" />Cerrar sesión
      </button>
    </nav>
  </header>

  <app-estado
    [cargando]="cargando()"
    [error]="error()"
    [vacio]="empresas().length === 0"
    mensajeVacio="Todavía no hay empresas."
  >
    <ul class="o-rejilla">
      @for (empresa of empresas(); track empresa.id) {
        <li>
          <app-tarjeta-empresa [empresa]="empresa" [meta]="empresa.sector.nombre">
            @if (esVistaProfesor(empresa) && !empresa.publicada) {
              <span class="c-etiqueta c-etiqueta--no-publicada">No publicada</span>
            }
          </app-tarjeta-empresa>
        </li>
      }
    </ul>
  </app-estado>
</main>
