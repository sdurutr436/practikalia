<main class="o-pagina">
  <app-cabecera titulo="Empresas" />

  <div class="c-filtros">
    <!-- Barra de móvil: siempre abierta y con el engranaje dentro. En pantalla
         ancha desaparece entera y mandan la lupa y la pastilla de "Filtros" de
         debajo; solo una de las dos existe a la vez para el lector de pantalla,
         porque la otra está en display:none. -->
    <app-buscador
      modo="fijo"
      etiqueta="Buscar empresas"
      marcador="Nombre, sector, etiqueta…"
      [valor]="texto()"
      (buscar)="buscar($event)"
    >
      <button
        class="c-buscador__ajustes"
        type="button"
        aria-label="Filtros"
        aria-controls="filtros-avanzados"
        [attr.aria-expanded]="filtrosAbiertos()"
        (click)="alternarFiltros()"
      >
        <app-icono nombre="configuracion" />
      </button>
    </app-buscador>

    @if (esProfesor()) {
      <app-pastillas
        [opciones]="pastillas"
        [activa]="filtroActivo()"
        ruta="/empresas"
        parametro="publicada"
      />
    }

    <button
      class="c-filtro c-filtros__avanzados"
      [class.c-filtro--activo]="filtrosActivos() > 0"
      type="button"
      [attr.aria-expanded]="filtrosAbiertos()"
      aria-controls="filtros-avanzados"
      (click)="alternarFiltros()"
    >
      <app-icono nombre="configuracion" />
      Filtros
      @if (filtrosActivos() > 0) {
        <span>({{ filtrosActivos() }})</span>
      }
    </button>

    <app-buscador
      modo="desplegable"
      etiqueta="Buscar empresas"
      marcador="Nombre, sector, etiqueta…"
      [valor]="texto()"
      (buscar)="buscar($event)"
    />
  </div>

  @if (filtrosAbiertos()) {
    <div class="c-panel-filtros" id="filtros-avanzados">
      <label class="c-campo">
        <span class="c-campo__etiqueta"><app-icono nombre="etiqueta" />Sector</span>
        <app-desplegable
          [opciones]="opcionesSector()"
          [valor]="sectorId()"
          (cambia)="cambiarSector($event)"
        >
          <option value="">Cualquiera</option>
        </app-desplegable>
      </label>

      <fieldset class="c-panel-filtros__etiquetas">
        <legend class="c-campo__etiqueta">Etiquetas</legend>
        <ul class="o-etiquetas">
          @for (etiqueta of catalogo(); track etiqueta.id) {
            <li>
              <label
                class="c-checkbox c-filtro"
                [class.c-filtro--activo]="etiquetaIds().includes(etiqueta.id)"
              >
                <input
                  type="checkbox"
                  [checked]="etiquetaIds().includes(etiqueta.id)"
                  (change)="alternarEtiqueta(etiqueta.id)"
                />
                {{ etiqueta.nombre }}
              </label>
            </li>
          }
        </ul>
      </fieldset>

      @if (filtrosActivos() > 0) {
        <app-boton [secundario]="true" (click)="limpiarFiltros()">Limpiar filtros</app-boton>
      }
    </div>
  }

  <app-estado
    [cargando]="cargando()"
    [error]="error()"
    [vacio]="empresas().length === 0"
    [mensajeVacio]="mensajeVacio()"
  >
    <ul class="o-rejilla">
      @for (empresa of empresas(); track empresa.id) {
        <li>
          <app-tarjeta-empresa [empresa]="empresa" [meta]="empresa.sector.nombre">
            <!-- El estado de publicación es cosa del profesorado: al alumnado
                 el backend solo le manda publicadas y su DTO ni trae el campo. -->
            @if (esVistaProfesor(empresa)) {
              <span
                class="c-tarjeta-empresa__estado"
                [class.c-tarjeta-empresa__estado--publicada]="empresa.publicada"
                role="img"
                [attr.aria-label]="empresa.publicada ? 'Publicada' : 'Sin publicar'"
              >
                <app-icono [nombre]="empresa.publicada ? 'aprobar' : 'rechazar'" />
              </span>
            }
          </app-tarjeta-empresa>
        </li>
      }
    </ul>
  </app-estado>

  <app-paginacion
    [pagina]="paginaActual()"
    [paginas]="paginas()"
    seccion="empresas"
    (ir)="irAPagina($event)"
  />
</main>
