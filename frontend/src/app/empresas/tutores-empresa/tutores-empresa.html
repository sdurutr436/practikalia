<div class="c-tutores">
  @for (fila of tutores().controls; track fila; let i = $index) {
    <div class="c-tutores__fila" [formGroup]="fila">
      <input
        class="c-campo__entrada"
        type="text"
        placeholder="Nombre"
        aria-label="Nombre del tutor"
        formControlName="nombre"
      />
      <input
        class="c-campo__entrada"
        type="text"
        placeholder="Cargo"
        aria-label="Cargo del tutor"
        formControlName="cargo"
      />
      <input
        class="c-campo__entrada"
        type="text"
        placeholder="Teléfono"
        aria-label="Teléfono del tutor"
        formControlName="telefono"
      />
      <input
        class="c-campo__entrada"
        type="email"
        placeholder="Correo"
        aria-label="Correo del tutor"
        formControlName="correo"
      />
      <button
        class="c-tutores__quitar"
        type="button"
        aria-label="Quitar este tutor"
        [disabled]="tutores().length === 1"
        (click)="quitar(i)"
      >
        <app-icono nombre="rechazar" />
      </button>
    </div>
  }
</div>
<app-boton icono="anadir" [secundario]="true" (click)="anadir()">Añadir tutor</app-boton>
