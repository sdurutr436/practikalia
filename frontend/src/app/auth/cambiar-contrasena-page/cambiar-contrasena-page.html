<main class="o-centrado">
  <form class="c-formulario" [formGroup]="form" (ngSubmit)="enviar()">
    <h1 class="c-formulario__titulo">Cambiar contraseña</h1>
    <p>Debes cambiar tu contraseña antes de continuar.</p>

    @if (error(); as mensaje) {
      <app-alerta>{{ mensaje }}</app-alerta>
    }

    <app-campo
      etiqueta="Contraseña actual"
      icono="contrasena"
      para="contrasena-actual"
      [control]="form.controls.contrasenaActual"
      error="Introduce la contraseña actual."
    >
      <input
        class="c-campo__entrada"
        id="contrasena-actual"
        type="password"
        formControlName="contrasenaActual"
        autocomplete="current-password"
      />
    </app-campo>

    <app-campo
      etiqueta="Contraseña nueva"
      icono="contrasena"
      para="contrasena-nueva"
      [control]="form.controls.contrasenaNueva"
      error="Mínimo 8 caracteres, con mayúscula, minúscula, número y carácter especial."
    >
      <input
        class="c-campo__entrada"
        id="contrasena-nueva"
        type="password"
        formControlName="contrasenaNueva"
        autocomplete="new-password"
      />
    </app-campo>

    <app-boton tipo="submit" icono="guardar" [cargando]="enviando()">Cambiar contraseña</app-boton>
  </form>
</main>
