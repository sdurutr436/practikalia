<main class="o-pagina">
  <app-volver [a]="['/empresas', empresaId]" texto="Volver a la empresa" />

  @if (cargando()) {
    <p>Cargando…</p>
  } @else {
    <form class="c-formulario" [formGroup]="form" (ngSubmit)="enviar()">
      <h1 class="c-formulario__titulo">{{ esEdicion ? 'Editar review' : 'Nueva review' }}</h1>

      @if (error(); as mensaje) {
        <app-alerta>{{ mensaje }}</app-alerta>
      }

      <app-campo
        etiqueta="Contenido"
        icono="comentario"
        para="contenido"
        [control]="form.controls.contenido"
        error="Escribe el contenido de la review."
      >
        <textarea class="c-campo__entrada" id="contenido" formControlName="contenido"></textarea>
      </app-campo>

      <app-campo
        etiqueta="Calificación ({{ config().min }}–{{ config().max }})"
        icono="calificacion"
        para="calificacion"
        [control]="form.controls.calificacion"
        error="Indica una calificación entre {{ config().min }} y {{ config().max }}."
      >
        <input
          class="c-campo__entrada"
          id="calificacion"
          type="number"
          [min]="config().min"
          [max]="config().max"
          formControlName="calificacion"
        />
      </app-campo>

      <app-boton tipo="submit" [icono]="esEdicion ? 'guardar' : 'anadir'" [cargando]="guardando()">
        {{ esEdicion ? 'Guardar cambios' : 'Crear review' }}
      </app-boton>
    </form>
  }
</main>
