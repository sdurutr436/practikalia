<main class="o-pagina">
  <app-cabecera titulo="Reviews pendientes de moderación" />

  <app-estado
    [cargando]="cargando()"
    [error]="error()"
    [vacio]="reviews().length === 0"
    mensajeVacio="No hay reviews pendientes."
  >
    <ul class="o-lista">
      @for (review of reviews(); track review.id) {
        <li class="c-fila">
          <p>
            {{ review.alumnoCorreo }} · {{ review.calificacion }} ·
            <a [routerLink]="['/empresas', review.empresaId]">Ver empresa</a>
          </p>
          <p>{{ review.contenido }}</p>

          @if (errorModeracion()?.id === review.id) {
            <app-alerta>{{ errorModeracion()?.mensaje }}</app-alerta>
          }

          <div class="c-acciones">
            <app-boton
              icono="aprobar"
              [deshabilitado]="guardandoId() === review.id"
              (click)="aprobar(review)"
            >
              Aprobar
            </app-boton>
            <app-campo
              etiqueta="Motivo de rechazo"
              icono="comentario"
              [para]="'motivo-' + review.id"
            >
              <input
                class="c-campo__entrada"
                type="text"
                [id]="'motivo-' + review.id"
                placeholder="Motivo de rechazo"
                #motivo
              />
            </app-campo>
            <app-boton
              icono="rechazar"
              [secundario]="true"
              [deshabilitado]="guardandoId() === review.id"
              (click)="rechazar(review, motivo.value)"
            >
              Rechazar
            </app-boton>
          </div>
        </li>
      }
    </ul>
  </app-estado>
</main>
