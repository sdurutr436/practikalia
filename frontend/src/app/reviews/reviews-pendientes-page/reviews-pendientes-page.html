<main class="o-pagina">
  <header class="c-cabecera">
    <h1 class="c-cabecera__titulo">Reviews pendientes de moderación</h1>
  </header>

  <app-estado
    [cargando]="cargando()"
    [error]="error()"
    [vacio]="reviews().length === 0"
    mensajeVacio="No hay reviews pendientes."
  >
    <ul class="o-lista">
      @for (review of reviews(); track review.id) {
        <li class="c-fila">
          <p>
            {{ review.alumnoCorreo }} · {{ review.calificacion }} ·
            <a [routerLink]="['/empresas', review.empresaId]">Ver empresa</a>
          </p>
          <p>{{ review.contenido }}</p>

          @if (errorModeracion()?.id === review.id) {
            <p class="c-alerta c-alerta--error" role="alert">{{ errorModeracion()?.mensaje }}</p>
          }

          <div class="c-acciones">
            <button class="c-boton" type="button" [disabled]="guardandoId() === review.id" (click)="aprobar(review)">
              <app-icono nombre="aprobar" />Aprobar
            </button>
            <div class="c-campo">
              <label class="c-campo__etiqueta" [for]="'motivo-' + review.id">
                <app-icono nombre="comentario" />Motivo de rechazo
              </label>
              <input class="c-campo__entrada" type="text" [id]="'motivo-' + review.id" placeholder="Motivo de rechazo" #motivo />
            </div>
            <button
              class="c-boton c-boton--secundario"
              type="button"
              [disabled]="guardandoId() === review.id"
              (click)="rechazar(review, motivo.value)"
            >
              <app-icono nombre="rechazar" />Rechazar
            </button>
          </div>
        </li>
      }
    </ul>
  </app-estado>
</main>
