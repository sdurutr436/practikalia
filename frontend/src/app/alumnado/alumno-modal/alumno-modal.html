<app-ficha-persona
  [form]="form"
  [titulo]="titulo()"
  prefijo="alumno"
  [textoGuardar]="esAlta() ? 'Crear alumno' : 'Guardar cambios'"
  [guardando]="guardando()"
  [error]="error()"
  (guardar)="enviar()"
  (cerrar)="cerrar.emit()"
>
  <app-campo campoExtra etiqueta="Clase" icono="grado" para="alumno-grado">
    <app-desplegable id="alumno-grado" [control]="form.controls.gradoId" [opciones]="clases()" />
  </app-campo>

  <app-campo campoExtra etiqueta="Curso" icono="fecha" para="alumno-anio">
    <app-selector-curso
      id="alumno-anio"
      etiqueta="Curso academico"
      vacio="Sin curso"
      [control]="form.controls.anio"
    />
  </app-campo>
</app-ficha-persona>
