<div class="o-marco c-marco">
  <app-fondo />

  <nav class="c-menu" [class.c-menu--contraido]="!abierto()" aria-label="Menú principal">
    <div class="c-menu__cabecera">
      <button
        class="c-menu__alternar"
        type="button"
        [attr.aria-expanded]="abierto()"
        [attr.aria-label]="abierto() ? 'Contraer el menú' : 'Desplegar el menú'"
        (click)="abierto.set(!abierto())"
      >
        <app-icono nombre="menu" />
      </button>
      <span class="c-menu__marca">Practikalia</span>
    </div>

    <ul class="c-menu__secciones">
      @for (seccion of secciones(); track seccion.ruta) {
        <li>
          <a
            class="c-menu__seccion"
            routerLinkActive="c-menu__seccion--activa"
            [routerLink]="seccion.ruta"
            [title]="seccion.etiqueta"
          >
            <app-icono [nombre]="seccion.icono" />
            <span class="c-menu__texto">{{ seccion.etiqueta }}</span>
          </a>
        </li>
      }
    </ul>

    <div class="c-menu__cuenta">
      <span class="c-menu__avatar" aria-hidden="true"><app-icono nombre="persona" /></span>
      <span class="c-menu__titulos">
        <span class="c-menu__correo">{{ sesion()?.correo ?? 'Mi cuenta' }}</span>
        <span class="c-menu__rol">{{ rolLegible() }}</span>
      </span>
    </div>
  </nav>

  <div class="c-marco__contenido">
    <header class="c-barra">
      <nav class="c-acciones" aria-label="Acciones de la sesión">
        @if (sesion()?.rol === 'PROFESOR') {
          <a class="c-boton" routerLink="/empresas/nueva"
            ><app-icono nombre="anadir" />Nueva empresa</a
          >
        }
        <button class="c-boton c-boton--secundario" type="button" (click)="cerrarSesion()">
          <app-icono nombre="salir" />Cerrar sesión
        </button>
      </nav>
    </header>

    <ng-content />
  </div>
</div>
