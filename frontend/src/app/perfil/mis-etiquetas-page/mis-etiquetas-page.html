<main class="o-pagina">
  <app-volver a="/empresas" />

  <app-cabecera titulo="Mis etiquetas" />

  <app-estado [cargando]="cargando()" [error]="error()">
    <form class="c-formulario" (ngSubmit)="guardar()">
      @if (errorGuardar(); as mensaje) {
        <app-alerta>{{ mensaje }}</app-alerta>
      }
      @if (guardado()) {
        <app-alerta tipo="aviso">Etiquetas guardadas.</app-alerta>
      }

      @if (catalogo().length === 0) {
        <p>Todavía no hay etiquetas en el catálogo.</p>
      } @else {
        <app-campo etiqueta="Etiquetas de interés" icono="etiqueta" [grupo]="true">
          @for (etiqueta of catalogo(); track etiqueta.id) {
            <label class="c-checkbox">
              <input
                type="checkbox"
                [checked]="seleccionadas().has(etiqueta.id)"
                (change)="toggle(etiqueta.id, $any($event.target).checked)"
              />
              {{ etiqueta.nombre }}
            </label>
          }
        </app-campo>
      }

      <app-boton tipo="submit" icono="guardar" [cargando]="guardando()">Guardar</app-boton>
    </form>
  </app-estado>
</main>
