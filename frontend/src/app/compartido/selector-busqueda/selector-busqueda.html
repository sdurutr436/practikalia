<div class="c-selector">
  <app-icono class="c-selector__lupa" nombre="buscar" />

  <input
    class="c-selector__entrada"
    type="text"
    role="combobox"
    autocomplete="off"
    aria-autocomplete="list"
    [attr.aria-controls]="lista"
    [attr.aria-expanded]="abierto()"
    [attr.aria-activedescendant]="abierto() && filtradas().length ? opcionId(resaltada()) : null"
    [attr.aria-label]="etiqueta()"
    [placeholder]="marcadorActual()"
    [value]="texto()"
    (focus)="abrir()"
    (input)="escribir($any($event.target).value)"
    (keydown)="teclear($event)"
    (blur)="cerrar()"
  />

  @if (abierto()) {
    <ul class="c-selector__lista" [id]="lista" role="listbox">
      @for (opcion of filtradas(); track opcion.id; let i = $index) {
        <!-- El mousedown se anula para que elegir con el ratón no dispare el
             blur de la entrada, que cerraría la lista antes del click. -->
        <li
          class="c-selector__opcion"
          [class.c-selector__opcion--resaltada]="i === resaltada()"
          [id]="opcionId(i)"
          role="option"
          [attr.aria-selected]="opcion.id === valor()"
          (mouseenter)="resaltada.set(i)"
          (mousedown)="$event.preventDefault()"
          (click)="elegir(opcion)"
        >
          <span class="c-selector__nombre">{{ opcion.nombre }}</span>
          @if (opcion.id === valor()) {
            <app-icono class="c-selector__marca" nombre="aprobar" />
          }
        </li>
      } @empty {
        <li class="c-selector__nada">{{ vacio() }}</li>
      }
    </ul>
  }
</div>
