<main class="o-pagina">
  <a class="c-volver" routerLink="/empresas"><app-icono nombre="volver" />Volver al listado</a>

  <header class="c-cabecera">
    <h1 class="c-cabecera__titulo">Mis intereses</h1>
  </header>

  <app-estado
    [cargando]="cargando()"
    [error]="error()"
    [vacio]="intereses().length === 0"
    mensajeVacio="Todavía no has marcado interés en ninguna empresa."
  >
    <ul class="o-lista">
      @for (interes of intereses(); track interes.empresaId + '-' + interes.anio) {
        <li class="c-fila">
          <a [routerLink]="['/empresas', interes.empresaId]">{{ interes.empresaNombre }}</a>
          · {{ interes.gradoNombre }} ({{ interes.anio }})
        </li>
      }
    </ul>
  </app-estado>
</main>
