<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="practikalia-arch-title practikalia-arch-desc">
      <title id="practikalia-arch-title">Arquitectura de despliegue de Practikalia</title>
      <desc id="practikalia-arch-desc">El equipo de un centro habla por HTTP en el puerto 80 solo con el contenedor frontend, que sirve la app y hace de proxy a /api/; backend y postgres viven en una red interna sin exposición externa, y backend comparte con frontend un volumen de archivos subidos.</desc>

      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: red interna, sin exposición externa (drawn before arrows and nodes) -->
      <rect x="500" y="168" width="440" height="132" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <rect x="676" y="172" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="181" fill="rgba(45,49,66,0.45)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">RED INTERNA</text>

      <!-- Arrows first (behind boxes) -->
      <line x1="200" y1="232" x2="280" y2="232" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="440" y1="232" x2="520" y2="232" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="680" y1="232" x2="760" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Dashed: volumen de subidas compartido entre backend y frontend -->
      <path d="M 600,264 V 332 Q 600,340 592,340 H 368 Q 360,340 360,332 V 264"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="212" y="212" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="221" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP :80</text>

      <rect x="456" y="212" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="221" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">/API/*</text>

      <rect x="684" y="212" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="720" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JDBC :5432</text>

      <rect x="432" y="320" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="329" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPLOADS_DATA</text>

      <!-- Node: Equipo del centro (input) -->
      <rect x="40" y="200" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="200" width="160" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="217" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="120" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Equipo del centro</text>
      <text x="120" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">navegador</text>

      <!-- Node: frontend (focal coral) -->
      <rect x="280" y="200" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="200" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="288" y="208" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="308" y="217" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROXY</text>
      <text x="360" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">frontend</text>
      <text x="360" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nginx :80</text>

      <!-- Node: backend -->
      <rect x="520" y="200" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="200" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="528" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="542" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="600" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">backend</text>
      <text x="600" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">spring boot :8080</text>

      <!-- Node: postgres (store) -->
      <rect x="760" y="200" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="760" y="200" width="160" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="768" y="208" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="780" y="217" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="840" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">postgres</text>
      <text x="840" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">postgresql :5432</text>

      <!-- Legend strip -->
      <line x1="40" y1="404" x2="920" y2="404" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="436" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entrada única</text>

      <rect x="190" y="436" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="210" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Servicio interno</text>

      <rect x="340" y="436" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="360" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Almacenamiento</text>

      <line x1="490" y1="441" x2="518" y2="441" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="526" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP</text>

      <line x1="640" y1="441" x2="668" y2="441" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="676" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Proxy</text>

      <line x1="790" y1="441" x2="818" y2="441" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="826" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Compartido</text>
    </svg>
